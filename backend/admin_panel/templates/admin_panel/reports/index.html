{% extends "admin_panel/base.html" %}
{% block title %}Reports — RealmOpus Staff{% endblock %}
{% block content %}
<h1 class="eo-title mb-1">Reports</h1>
<p class="eo-subtitle mb-8">Export data for accounting, review, or record-keeping.</p>

<div class="grid sm:grid-cols-2 gap-4">
  {% for report in reports %}
  <a href="{{ report.url }}" class="eo-card eo-card-pad" style="display: block;">
    <h2 class="eo-display font-semibold text-base mb-1">{{ report.title }}</h2>
    <p class="eo-subtitle text-sm">{{ report.description }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
