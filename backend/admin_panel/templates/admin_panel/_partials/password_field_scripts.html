<script>
  function eoGenerateRandomPassword(length) {
    length = length || 12;
    var lower = 'abcdefghijkmnopqrstuvwxyz';
    var upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    var digits = '23456789';
    var all = lower + upper + digits;
    var pw = lower[Math.floor(Math.random() * lower.length)]
      + upper[Math.floor(Math.random() * upper.length)]
      + digits[Math.floor(Math.random() * digits.length)];
    for (var i = pw.length; i < length; i++) {
      pw += all[Math.floor(Math.random() * all.length)];
    }
    return pw.split('').sort(function () { return Math.random() - 0.5; }).join('');
  }

  function eoEnhancePasswordField(inputId, options) {
    options = options || {};
    var input = document.getElementById(inputId);
    if (!input) return;

    var wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.gap = '0.5rem';
    input.parentNode.insertBefore(wrapper, input);
    wrapper.appendChild(input);
    input.style.flex = '1';

    var toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.textContent = 'Show';
    toggleBtn.className = 'eo-link text-xs';
    toggleBtn.style.whiteSpace = 'nowrap';
    toggleBtn.addEventListener('click', function () {
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      toggleBtn.textContent = showing ? 'Show' : 'Hide';
    });
    wrapper.appendChild(toggleBtn);

    if (options.generate) {
      var genBtn = document.createElement('button');
      genBtn.type = 'button';
      genBtn.textContent = 'Generate';
      genBtn.className = 'eo-link text-xs';
      genBtn.style.whiteSpace = 'nowrap';
      genBtn.addEventListener('click', function () {
        var pw = eoGenerateRandomPassword(12);
        input.type = 'text';
        toggleBtn.textContent = 'Hide';
        input.value = pw;
        input.dispatchEvent(new Event('input'));
      });
      wrapper.appendChild(genBtn);
    }
  }

  function eoAttachPasswordMatchCheck(field1Id, field2Id, messageId) {
    var f1 = document.getElementById(field1Id);
    var f2 = document.getElementById(field2Id);
    var msg = document.getElementById(messageId);
    if (!f1 || !f2 || !msg) return;
    function check() {
      if (!f2.value) { msg.style.display = 'none'; return; }
      msg.style.display = 'block';
      if (f1.value === f2.value) {
        msg.textContent = 'Passwords match.';
        msg.style.color = 'var(--ledger)';
      } else {
        msg.textContent = "Passwords don't match yet.";
        msg.style.color = 'var(--stamp)';
      }
    }
    f1.addEventListener('input', check);
    f2.addEventListener('input', check);
  }
</script>
